[project]
name = "jev-cascade"
version = "0.1.0"
description = "Measures how much CUAD license-agreement text Jev can Bin before an expensive model reads it"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
]

[project.scripts]
jev-cascade = "jev_cascade.cli:main"
jev-cascade-sample = "jev_cascade.sample_cli:main"
jev-cascade-operating-point = "jev_cascade.operating_point_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_cascade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
